<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Weather">
    <link rel="apple-touch-icon" href="https://api.iconify.design/lucide:cloud-sun.png?width=192&height=192&color=%23ffffff">
    <link rel="icon" type="image/png" href="https://api.iconify.design/lucide:cloud-sun.png?width=32&height=32&color=%23ffffff">
    <link rel="manifest" href="./manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <title>Weather Histogram</title>
    <link rel="stylesheet" href="./style.css">

</head>
<body>
    <div id="overlay">
        <div class="loader"></div>
        <p id="status-text">Obteniendo ubicación...</p>
        <div id="error-msg"></div>
    </div>

    <div id="controls-bar">
        <div class="mobile-toggles">
            <button id="toggle-search-btn" title="Cambiar ubicación">📍</button>
            <button id="toggle-legend-btn" title="Ver leyenda">❓</button>
        </div>

        <div class="controls-left">
            <div class="search-box" id="search-box">
                <input type="text" id="location-input" placeholder="Buscar ciudad (ej: Madrid, Tokyo)..." autocomplete="off">
                <div id="suggestions"></div>
                <button id="search-btn">Buscar</button>
                <button id="geo-btn" title="Usar mi ubicación" style="background: var(--input-bg); color: var(--text-primary); border: 1px solid var(--grid-color);">📍</button>
            </div>

            <div class="legend" id="legend">
                <div class="legend-item" title="Temperatura">
                    <div class="legend-color" style="background: #d32f2f; border: 1px solid white;"></div>
                    <span>🌡️</span>
                </div>
                <div class="legend-item" title="Precipitación">
                    <div class="legend-color" style="background: #1976d2;"></div>
                    <span>🌧️</span>
                </div>
                <div class="legend-item" title="Prob. Lluvia">
                    <div class="legend-color" style="background: #0288d1; height: 2px; margin-top: 4px;"></div>
                    <span>☔</span>
                </div>
                <div class="legend-item" title="Nubes">
                    <div class="legend-color" style="background: #9e9e9e; opacity: 0.5;"></div>
                    <span>☁️</span>
                </div>
                <div class="legend-item" title="Viento">
                    <div class="legend-color" style="background: #757575; height: 2px; margin-top: 4px;"></div>
                    <span>💨</span>
                </div>
                <div class="legend-item" title="Índice UV">
                    <div class="legend-color" style="background: #fbc02d; height: 2px; margin-top: 4px;"></div>
                    <span>☀️</span>
                </div>
            </div>
        </div>

        <div class="controls-right">
            <button class="theme-toggle" id="theme-toggle" style="font-size: 1.2rem; padding: 5px 10px;">🌙</button>
        </div>
    </div>

    <header id="top-panel">
        <div class="top-panel-info">
            <div class="location-group">
                <div id="location-name">Cargando...</div>
                <div id="weather-summary">--</div>
                <div class="custom-tooltip" id="location-tooltip">
                    <strong id="tt-location">Ubicación</strong><br>
                    <span id="tt-summary">Resumen del tiempo</span>
                </div>
            </div>
            <div id="current-time-display">
                <div class="time-main">--:--</div>
                <div class="date-sub">--</div>
            </div>
        </div>

        <div class="top-panel-metrics">
            <div class="data-card">
                <div class="data-label">🌡️ Temp / ST</div>
                <div class="data-value" id="val-temp" style="font-size: 1.3rem;">--<span class="data-unit">°C</span></div>
                <div class="data-label" id="val-apparent" style="font-size: 0.6rem; margin-top: 1px;">ST: --°C</div>
            </div>
            <div class="data-card" id="wind-card">
                <div class="data-label">💨 Viento</div>
                <div id="wind-compass-container" style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
                    <div id="wind-compass" style="width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--text-secondary); position: relative; display: flex; align-items: center; justify-content: center;">
                        <div id="wind-arrow" style="width: 2px; height: 14px; background: var(--text-primary); position: relative; transition: transform 0.5s;">
                            <div style="position: absolute; top: -2px; left: -3px; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 6px solid var(--text-primary);"></div>
                        </div>
                    </div>
                    <div class="data-value" id="val-wind" style="font-size: 0.9rem !important;">--<span class="data-unit">km/h</span></div>
                </div>
            </div>
            <div class="data-card">
                <div class="data-label">🍃 AQI</div>
                <div class="data-value" id="val-aqi" style="font-size: 1rem;">
                    <span class="aqi-text">--</span>
                    <span class="info-icon">i
                        <div class="custom-tooltip" id="aqi-tooltip"></div>
                    </span>
                </div>
            </div>
            <div class="data-card">
                <div class="data-label">🌻 Polen</div>
                <div class="data-value" id="val-pollen" style="font-size: 1rem;">
                    <span class="pollen-text">--</span>
                    <span class="info-icon">i
                        <div class="custom-tooltip" style="min-width: 200px;">
                            <div style="text-align:center; font-weight:bold; margin-bottom:5px;">Riesgo por Planta</div>
                            <canvas id="pollen-radar" width="150" height="150"></canvas>
                            <div id="pollen-details" style="font-size: 0.65rem; line-height: 1.2;"></div>
                        </div>
                    </span>
                </div>
            </div>
            <div class="data-card">
                <div class="data-label">🌊 Lluvia</div>
                <div class="data-value" id="val-precip" style="font-size: 1.3rem;">--<span class="data-unit">mm</span></div>
            </div>
            <div class="data-card">
                <div class="data-label">💧 Prob. Lluvia</div>
                <div class="data-value" id="val-precip-prob" style="font-size: 1.3rem;">--<span class="data-unit">%</span></div>
            </div>
            <div class="data-card">
                <div class="data-label">☁️ Nubes</div>
                <div class="data-value" id="val-clouds" style="font-size: 1.3rem;">--<span class="data-unit">%</span></div>
            </div>
        </div>
    </header>

    <div id="chart-area" style="position: relative; flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #f5f5f5;">
        <div id="reference-line" style="position: absolute; left: 60px; top: 0; bottom: 0; width: 2px; background: rgba(0,0,0,0.4); z-index: 10; pointer-events: none;"></div>
        <canvas id="fixed-overlay-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20;"></canvas>
        <main id="scroll-container">
            <div id="canvas-wrapper">
                <div id="now-line" style="position: absolute; top: 0; bottom: 0; width: 0px; border-left: 2px dashed #ff4d4d; pointer-events: none; z-index: 10;"></div>
                <div id="now-btn-track" style="position: absolute; top: 28px; left: 0; width: 100%; height: 0; pointer-events: none; display: flex; z-index: 500;">
                    <div id="now-btn-spacer" style="width: 0px; flex-shrink: 0;"></div>
                    <div style="position: sticky; left: 40px; right: 40px; width: 0; display: flex; justify-content: center; overflow: visible;">
                        <button id="now-btn" title="Ir al momento actual" style="pointer-events: auto;">
                            <span style="font-size: 0.9rem;">📍</span>
                            <span class="btn-text">AHORA</span>
                        </button>
                    </div>
                </div>
                <canvas id="main-canvas"></canvas>
            </div>
        </main>
    </div>

    <footer id="bottom-nav-container">
        <button id="toggle-nav-btn" class="toggle-nav-btn" title="Cambiar vista">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
        </button>

        <div id="minimap-container">
            <canvas id="minimap-canvas"></canvas>
            <div id="minimap-viewport"></div>
        </div>

        <div id="daily-cards-container">
            <!-- Cards will be generated here -->
        </div>
    </footer>

    <script src="./app.js" defer></script>

</body>
</html>
