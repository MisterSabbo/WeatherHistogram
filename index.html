        /**
         * CARGA DE DATOS
         */
        function generateMockData(pastDays, forecastDays) {
            const now = Math.floor(Date.now() / 1000);
            const start = now - (pastDays * 24 * 3600);
            const end = now + (forecastDays * 24 * 3600);
            
            const times = [];
            for (let t = start; t <= end; t += 3600) {
                times.push(t);
            }
            
            const hourlyCount = times.length;
            const mockForecast = {
                timezone: "UTC",
                hourly: {
                    time: times,
                    temperature_2m: Array.from({length: hourlyCount}, (_, i) => 15 + 10 * Math.sin(i / 12) + Math.random() * 2),
                    apparent_temperature: Array.from({length: hourlyCount}, (_, i) => 13 + 10 * Math.sin(i / 12) + Math.random() * 2),
                    precipitation: Array.from({length: hourlyCount}, () => Math.random() > 0.9 ? Math.random() * 2 : 0),
                    precipitation_probability: Array.from({length: hourlyCount}, () => Math.floor(Math.random() * 30)),
                    cloudcover: Array.from({length: hourlyCount}, () => Math.floor(Math.random() * 100)),
                    wind_speed_10m: Array.from({length: hourlyCount}, () => 5 + Math.random() * 15),
                    weather_code: Array.from({length: hourlyCount}, () => 0)
                },
                daily: {
                    time: [],
                    sunrise: [],
                    sunset: []
                }
            };
            
            for (let d = -pastDays; d <= forecastDays; d++) {
                const dayStart = Math.floor(new Date().setHours(0,0,0,0) / 1000) + (d * 24 * 3600);
                mockForecast.daily.time.push(dayStart);
                mockForecast.daily.sunrise.push(dayStart + 6 * 3600);
                mockForecast.daily.sunset.push(dayStart + 18 * 3600);
            }
            
            const mockAQI = {
                hourly: {
                    time: times,
                    european_aqi: Array.from({length: hourlyCount}, () => 20 + Math.floor(Math.random() * 30)),
                    alder_pollen: Array.from({length: hourlyCount}, () => Math.random() * 5),
                    birch_pollen: Array.from({length: hourlyCount}, () => Math.random() * 5),
                    grass_pollen: Array.from({length: hourlyCount}, () => Math.random() * 5),
                    mugwort_pollen: Array.from({length: hourlyCount}, () => Math.random() * 5),
                    olive_pollen: Array.from({length: hourlyCount}, () => Math.random() * 5),
                    ragweed_pollen: Array.from({length: hourlyCount}, () => Math.random() * 5)
                }
            };
            
            return { forecastData: mockForecast, aqiData: mockAQI };
        }

        async function fetchWeatherData(pastDays, forecastDays) {
            const cacheKey = `${state.lat.toFixed(4)},${state.lon.toFixed(4)},${pastDays},${forecastDays}`;
            const now = Date.now();

            if (weatherCache.has(cacheKey)) {
                const cached = weatherCache.get(cacheKey);
                if (now - cached.timestamp < CACHE_DURATION) {
                    console.log("Usando datos en caché para:", cacheKey);
                    state.rawForecast = cached.forecastData;
                    state.rawAQI = cached.aqiData;
                    processData(cached.forecastData, cached.aqiData);
                    handleResize();
                    return;
                }
            }

            if (state.isFetching) return;
            state.isFetching = true;

            const controller = new AbortController();
            const timeoutId = setTimeout(() => controller.abort(), 15000);

            try {
                const forecastUrl = `https://api.open-meteo.com/v1/forecast?latitude=${state.lat}&longitude=${state.lon}&hourly=temperature_2m,apparent_temperature,precipitation,precipitation_probability,cloudcover,wind_speed_10m,weather_code&daily=sunrise,sunset&timezone=auto&past_days=${pastDays}&forecast_days=${forecastDays}&timeformat=unixtime`;
                const aqiUrl = `https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${state.lat}&longitude=${state.lon}&hourly=european_aqi,alder_pollen,birch_pollen,grass_pollen,mugwort_pollen,olive_pollen,ragweed_pollen&timezone=auto&past_days=${pastDays}&forecast_days=${forecastDays}&timeformat=unixtime`;

                const [forecastRes, aqiRes] = await Promise.all([
                    fetch(forecastUrl, { signal: controller.signal }),
                    fetch(aqiUrl, { signal: controller.signal })
                ]);
                
                clearTimeout(timeoutId);
                
                if (!forecastRes.ok || !aqiRes.ok) throw new Error("Error en la respuesta de la API");

                const forecastData = await forecastRes.json();
                const aqiData = await aqiRes.json();
                
                if (forecastData.error || aqiData.error) {
                    throw new Error(forecastData.reason || aqiData.reason || "Error de API");
                }

                // Guardar en caché
                weatherCache.set(cacheKey, {
                    timestamp: now,
                    forecastData,
                    aqiData
                });

                state.rawForecast = forecastData;
                state.rawAQI = aqiData;

                processData(forecastData, aqiData);
                handleResize();
            } catch (err) {
                clearTimeout(timeoutId);
                console.error("fetchWeatherData error:", err);
                
                // Fallback: Si hay datos en caché (aunque estén expirados), los usamos
                if (weatherCache.has(cacheKey)) {
                    console.warn("API falló, usando datos expirados de la caché");
                    const cached = weatherCache.get(cacheKey);
                    state.rawForecast = cached.forecastData;
                    state.rawAQI = cached.aqiData;
                    
                    if (!state.locationName.endsWith('*')) {
                        state.locationName += '*';
                        updateLocationUI();
                    }
                    
                    processData(cached.forecastData, cached.aqiData);
                    handleResize();
                } else {
                    // Fallback: Si no hay nada en caché, generamos datos simulados
                    console.warn("API falló y no hay caché, generando datos simulados");
                    const mock = generateMockData(pastDays, forecastDays);
                    state.rawForecast = mock.forecastData;
                    state.rawAQI = mock.aqiData;
                    
                    state.locationName = "Ninguna";
                    updateLocationUI();
                    
                    processData(mock.forecastData, mock.aqiData);
                    handleResize();
                }
            } finally {
                state.isFetching = false;
            }
        }

        function processData(forecastData, aqiData) {
            if (!forecastData || !forecastData.hourly || !forecastData.hourly.time || !aqiData || !aqiData.hourly || !aqiData.hourly.time) {
                throw new Error("Datos de API incompletos o inválidos");
            }
            const hourly = forecastData.hourly;
            const daily = forecastData.daily;
            const aqiHourly = aqiData.hourly;
            
            // Validar zona horaria
            let tz = forecastData.timezone;
            try {
                new Intl.DateTimeFormat('en-US', { timeZone: tz });
            } catch (e) {
                console.warn("Invalid timezone from API, falling back to UTC", tz);
                tz = 'UTC';
            }
            state.timezone = tz;

            if (daily && daily.time) {
                daily.time.forEach((t, i) => {
                    const dateStr = new Date(t * 1000).toISOString().split('T')[0];
                    state.sunData[dateStr] = {
                        sunrise: daily.sunrise[i] * 1000,
                        sunset: daily.sunset[i] * 1000
                    };
                });
            }

            const hourFormatter = new Intl.DateTimeFormat('en-US', { hour: 'numeric', hourCycle: 'h23', timeZone: state.timezone });
            const dayFormatter = new Intl.DateTimeFormat('es-ES', { weekday: 'long', timeZone: state.timezone });
            const shortDayFormatter = new Intl.DateTimeFormat('es-ES', { weekday: 'short', timeZone: state.timezone });

            const newHourly = hourly.time.map((t, i) => {
                const timestamp = t * 1000;
                const dateObj = new Date(timestamp);
                
                // Usamos la fecha local de la ciudad para buscar datos de sol
                const dateStr = dateObj.toLocaleDateString('en-CA', { timeZone: state.timezone });
                const sun = state.sunData[dateStr];
                let isNight = sun ? (timestamp < sun.sunrise || timestamp > sun.sunset) : false;

                const pollen = {
                    alder: (aqiHourly.alder_pollen && aqiHourly.alder_pollen[i]) || 0,
                    birch: (aqiHourly.birch_pollen && aqiHourly.birch_pollen[i]) || 0,
                    grass: (aqiHourly.grass_pollen && aqiHourly.grass_pollen[i]) || 0,
                    mugwort: (aqiHourly.mugwort_pollen && aqiHourly.mugwort_pollen[i]) || 0,
                    olive: (aqiHourly.olive_pollen && aqiHourly.olive_pollen[i]) || 0,
                    ragweed: (aqiHourly.ragweed_pollen && aqiHourly.ragweed_pollen[i]) || 0
                };
                const maxPollen = Math.max(...Object.values(pollen));

                return {
                    time: timestamp,
                    localHour: parseInt(hourFormatter.format(dateObj)),
                    localDayName: dayFormatter.format(dateObj).toUpperCase(),
                    localDayShort: shortDayFormatter.format(dateObj).substring(0, 3).toUpperCase(),
                    temp: hourly.temperature_2m[i],
                    apparent: hourly.apparent_temperature[i],
                    precip: hourly.precipitation[i],
                    precipProb: hourly.precipitation_probability ? hourly.precipitation_probability[i] : 0,
                    clouds: hourly.cloudcover[i],
                    wind: hourly.wind_speed_10m[i],
                    weatherCode: hourly.weather_code[i],
                    aqi: aqiHourly.european_aqi ? aqiHourly.european_aqi[i] : null,
                    pollen: maxPollen,
                    pollenDetails: pollen,
                    isNight: isNight
                };
            });

            state.hourlyData = newHourly.sort((a, b) => a.time - b.time);
        }

        /**
         * RENDERIZADO
         */
        function render() {
            if (!state.hourlyData.length) return;
            drawMain();
            
            // Copy offscreen to main
            mainCtx.clearRect(0, 0, mainCanvas.width / state.dpr, mainCanvas.height / state.dpr);
            mainCtx.drawImage(offscreenCanvas, 0, 0, offscreenCanvas.width / state.dpr, offscreenCanvas.height / state.dpr);
            
            drawMinimap();
            updateTopPanel();
        }

        function drawMain() {
            const ctx = offscreenCtx;
            const w = offscreenCanvas.width / state.dpr;
            const h = offscreenCanvas.height / state.dpr;
            const styles = getComputedStyle(document.documentElement);

            ctx.clearRect(0, 0, w, h);
            
            ctx.save();
            // Translate to account for scroll position
            ctx.translate(-scrollContainer.scrollLeft, 0);
            
            // Fondo soleado
            drawSunnyBackground(ctx, w, h, styles, true);

            drawNightOverlay(ctx, h);
            drawGrid(ctx, w, h, styles);
            drawDayNames(ctx, w, h, styles);
            drawClouds(ctx, h, styles);
            drawPrecipitation(ctx, h, styles);
            drawPrecipitationProbability(ctx, h, styles);
            drawTemperature(ctx, h, styles);
            drawAxes(ctx, w, h, styles);
            drawCursor(ctx, h, styles);
            
            ctx.restore();
        }

        function drawSunnyBackground(ctx, w, h, styles, drawSunIcon) {
            const skyColor = '#fffde7'; // Siempre modo claro
            const sunColor = '#fdd835';
            const rayColor = '#fff59d';
            
            ctx.save();
            ctx.fillStyle = skyColor;
            // Fill the visible area
            ctx.fillRect(scrollContainer.scrollLeft, 0, w, h);
            
            if (drawSunIcon) {
                const startIdx = Math.max(0, Math.floor(scrollContainer.scrollLeft / PIXELS_PER_HOUR) - 5);
                const endIdx = Math.min(state.hourlyData.length, Math.ceil((scrollContainer.scrollLeft + scrollContainer.clientWidth) / PIXELS_PER_HOUR) + 5);
                
                for (let i = startIdx; i < endIdx; i++) {
                    const d = state.hourlyData[i];
                    if (d.localHour === 12) {
                        const x = i * PIXELS_PER_HOUR + PIXELS_PER_HOUR / 2;
                        drawSun(ctx, x, h * 0.25, sunColor, rayColor);
                    }
                }
            }
            ctx.restore();
        }

        function drawSun(ctx, x, y, sunColor, rayColor) {
            const radius = 25;
            const rayCount = 12;
            const rayLength = 20;
            
            ctx.save();
            // Resplandor
            const grad = ctx.createRadialGradient(x, y, radius, x, y, radius + 50);
            grad.addColorStop(0, 'rgba(253, 216, 53, 0.3)');
            grad.addColorStop(1, 'rgba(253, 216, 53, 0)');
            ctx.fillStyle = grad;
            ctx.beginPath();
            ctx.arc(x, y, radius + 50, 0, Math.PI * 2);
            ctx.fill();

            // Rayos
            ctx.strokeStyle = rayColor;
            ctx.lineWidth = 2;
            for (let i = 0; i < rayCount; i++) {
                const angle = (i / rayCount) * Math.PI * 2;
                ctx.beginPath();
                ctx.moveTo(x + Math.cos(angle) * (radius + 8), y + Math.sin(angle) * (radius + 8));
                ctx.lineTo(x + Math.cos(angle) * (radius + 8 + rayLength), y + Math.sin(angle) * (radius + 8 + rayLength));
                ctx.stroke();
            }
            
            // Sol
            ctx.fillStyle = sunColor;
            ctx.shadowBlur = 15;
            ctx.shadowColor = sunColor;
            ctx.beginPath();
            ctx.arc(x, y, radius, 0, Math.PI * 2);
            ctx.fill();
            ctx.restore();
        }

        function drawNightOverlay(ctx, h) {
            ctx.fillStyle = 'rgba(0, 0, 100, 0.05)'; // Siempre modo claro
            state.hourlyData.forEach((d, i) => {
                if (d.isNight) {
                    ctx.fillRect(i * PIXELS_PER_HOUR, 0, PIXELS_PER_HOUR, h);
                }
            });
        }

        function drawGrid(ctx, w, h, styles) {
            ctx.strokeStyle = '#e0e0e0'; // Siempre modo claro
            ctx.lineWidth = 1;
            ctx.beginPath();
            const xStart = scrollContainer.scrollLeft;
            const xEnd = xStart + scrollContainer.clientWidth;
            for (let temp = -20; temp <= 40; temp += 10) {
                const y = normalizeY(temp, -20, 40, h);
                ctx.moveTo(xStart, y);
                ctx.lineTo(xEnd, y);
            }
            ctx.stroke();

            // Divisiones de día
            ctx.strokeStyle = 'rgba(0,0,0,0.08)'; // Siempre modo claro
            const startIdx = Math.max(0, Math.floor(scrollContainer.scrollLeft / PIXELS_PER_HOUR) - 5);
            const endIdx = Math.min(state.hourlyData.length, Math.ceil((scrollContainer.scrollLeft + scrollContainer.clientWidth) / PIXELS_PER_HOUR) + 5);
            
            for (let i = startIdx; i < endIdx; i++) {
                const d = state.hourlyData[i];
                if (d.localHour === 0) {
                    ctx.beginPath();
                    ctx.moveTo(i * PIXELS_PER_HOUR, 0);
                    ctx.lineTo(i * PIXELS_PER_HOUR, h);
                    ctx.stroke();
                }
            }
        }

        function drawDayNames(ctx, w, h, styles) {
            ctx.save();
            ctx.fillStyle = 'rgba(0,0,0,0.15)'; // Increased opacity for better visibility
            ctx.font = '900 80px Inter';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const startIdx = Math.max(0, Math.floor(scrollContainer.scrollLeft / PIXELS_PER_HOUR) - 24);
            const endIdx = Math.min(state.hourlyData.length, Math.ceil((scrollContainer.scrollLeft + scrollContainer.clientWidth) / PIXELS_PER_HOUR) + 24);

            // Find the actual start of the day for the current visible range
            let dayStart = 0;
            for (let i = Math.max(0, startIdx); i >= 0; i--) {
                if (state.hourlyData[i].localHour === 0) {
                    dayStart = i;
                    break;
                }
            }

            let currentDayStart = dayStart;
            for (let i = dayStart + 1; i < endIdx + 24 && i < state.hourlyData.length; i++) {
                const d = state.hourlyData[i];
                if (d.localHour === 0) {
                    const midX = (currentDayStart + (i - 1 - currentDayStart) / 2) * PIXELS_PER_HOUR + PIXELS_PER_HOUR/2;
                    const dayName = state.hourlyData[currentDayStart].localDayName;
                    ctx.fillText(dayName, midX, h / 2);
                    currentDayStart = i;
                }
            }
            // Último día visible
            if (currentDayStart !== -1 && currentDayStart < endIdx + 24) {
                let nextDayStart = state.hourlyData.length;
                for (let i = currentDayStart + 1; i < state.hourlyData.length; i++) {
                    if (state.hourlyData[i].localHour === 0) {
                        nextDayStart = i;
                        break;
                    }
                }
                const midX = (currentDayStart + (nextDayStart - 1 - currentDayStart) / 2) * PIXELS_PER_HOUR + PIXELS_PER_HOUR/2;
                const dayName = state.hourlyData[currentDayStart].localDayName;
                ctx.fillText(dayName, midX, h / 2);
            }
            ctx.restore();
        }

        function drawClouds(ctx, h, styles) {
            const cloudColor = '#9e9e9e'; // Siempre modo claro
            
            // Gradiente vertical: más rico y con un toque azulado en las sombras
            const cloudGrad = ctx.createLinearGradient(0, h, 0, 0);
            cloudGrad.addColorStop(0, 'rgba(255, 255, 255, 0.2)'); 
            cloudGrad.addColorStop(0.4, 'rgba(226, 232, 240, 0.5)');
            cloudGrad.addColorStop(0.8, 'rgba(100, 116, 139, 0.7)');
            cloudGrad.addColorStop(1, 'rgba(51, 65, 85, 0.85)'); 
            
            ctx.fillStyle = cloudGrad;
            
            const startIdx = Math.max(0, Math.floor(scrollContainer.scrollLeft / PIXELS_PER_HOUR) - 5);
            const endIdx = Math.min(state.hourlyData.length, Math.ceil((scrollContainer.scrollLeft + scrollContainer.clientWidth) / PIXELS_PER_HOUR) + 5);
            
            const points = [];
            for (let i = startIdx; i < endIdx; i++) {
                const d = state.hourlyData[i];
                points.push({
                    x: i * PIXELS_PER_HOUR + PIXELS_PER_HOUR / 2,
                    y: h - (h * (d.clouds / 100))
                });
            }

            if (points.length < 2) return;

            // Función para crear el camino ondulado con puffiness dinámico y suavizado total
            const createPuffyPath = (pathCtx, offset = 0, basePuffScale = 12) => {
                const getPuff = (idx) => {
                    const cloudVal = state.hourlyData[idx + startIdx].clouds;
                    return (cloudVal / 100) * basePuffScale;
                };

                pathCtx.moveTo(points[0].x, points[0].y + offset);
                
                for (let i = 0; i < points.length - 1; i++) {
                    const p1 = points[i];
                    const p2 = points[i + 1];
                    const puff = (getPuff(i) + getPuff(i + 1)) / 2;
                    
                    // Si no hay nubes, dibujamos línea recta suave
                    if (puff < 0.5) {
                        pathCtx.lineTo(p2.x, p2.y + offset);
                        continue;
                    }

                    const midX = (p1.x + p2.x) / 2;
                    const midY = (p1.y + p2.y) / 2 + offset;
                    
                    // Para que sea "puffy" pero sin aristas, dividimos cada hora en dos pompas
                    // y nos aseguramos de que las tangentes en los puntos de unión sean horizontales.
                    
                    // Pompa 1: p1 -> mid
                    const cp1x = p1.x + (midX - p1.x) * 0.5;
                    const cp1y = p1.y + offset - puff;
                    const cp2x = midX - (midX - p1.x) * 0.5;
                    const cp2y = midY - puff;
                    pathCtx.bezierCurveTo(cp1x, cp1y, cp2x, cp2y, midX, midY);
                    
                    // Pompa 2: mid -> p2
                    const cp3x = midX + (p2.x - midX) * 0.5;
                    const cp3y = midY - puff;
                    const cp4x = p2.x - (p2.x - midX) * 0.5;
                    const cp4y = p2.y + offset - puff;
                    pathCtx.bezierCurveTo(cp3x, cp3y, cp4x, cp4y, p2.x, p2.y + offset);
                }
            };

            // Relleno principal
            ctx.beginPath();
            ctx.moveTo(0, h);
            ctx.lineTo(points[0].x, points[0].y);
            createPuffyPath(ctx);
            ctx.lineTo(state.hourlyData.length * PIXELS_PER_HOUR, h);
            ctx.lineTo(0, h);
            ctx.closePath();
            ctx.fill();

            // Textura de ruido sutil
            ctx.save();
            ctx.globalCompositeOperation = 'source-atop';
            ctx.fillStyle = 'rgba(255, 255, 255, 0.04)';
            for (let i = 0; i < 800; i++) {
                const rx = Math.random() * (state.hourlyData.length * PIXELS_PER_HOUR);
                const ry = Math.random() * h;
                ctx.fillRect(rx, ry, 1, 1);
            }
            ctx.restore();

            // Adornos internos (pompas de volumen)
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.2)';
            ctx.lineWidth = 1;
            ctx.beginPath();
            createPuffyPath(ctx, 12, 8); 
            ctx.stroke();
            
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
            ctx.beginPath();
            createPuffyPath(ctx, 25, 6); 
            ctx.stroke();
            ctx.restore();

            // Rim Light (Brillo en el borde superior)
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            createPuffyPath(ctx, -1, 13); 
            ctx.stroke();
            ctx.restore();

            // Línea de contorno principal
            ctx.save();
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.shadowBlur = 10;
            ctx.shadowColor = 'rgba(71, 85, 105, 0.3)';
            ctx.shadowOffsetY = 2;
            ctx.strokeStyle = '#64748b';
            ctx.lineWidth = 2;
            ctx.beginPath();
            createPuffyPath(ctx);
            ctx.stroke();
            ctx.restore();
        }

        function drawPrecipitation(ctx, h, styles) {
            ctx.fillStyle = '#1976d2'; // Siempre modo claro
            const startIdx = Math.max(0, Math.floor(scrollContainer.scrollLeft / PIXELS_PER_HOUR) - 5);
            const endIdx = Math.min(state.hourlyData.length, Math.ceil((scrollContainer.scrollLeft + scrollContainer.clientWidth) / PIXELS_PER_HOUR) + 5);
            
            const maxH = h * 0.9;
            for (let i = startIdx; i < endIdx; i++) {
                const d = state.hourlyData[i];
                if (d.precip > 0) {
                    let barH = d.precip * PIXELS_PER_MM;
                    const x = i * PIXELS_PER_HOUR + 5;
                    const bw = PIXELS_PER_HOUR - 10;
                    
                    if (barH > maxH) {
                        // Broken axis logic
                        ctx.fillRect(x, h - maxH, bw, maxH);
                        // Draw zigzag
                        ctx.save();
                        ctx.strokeStyle = 'white';
                        ctx.lineWidth = 2;
                        ctx.beginPath();
                        const zy = h - maxH + 15;
                        ctx.moveTo(x, zy);
                        ctx.lineTo(x + bw/4, zy - 5);
                        ctx.lineTo(x + bw*3/4, zy + 5);
                        ctx.lineTo(x + bw, zy);
                        ctx.stroke();
                        ctx.restore();
                    } else {
                        ctx.fillRect(x, h - barH, bw, barH);
                    }
                }
            }
        }

        let cachedRainPattern = null;
        let cachedSnowPattern = null;

        function drawPrecipitationProbability(ctx, h, styles) {
            const startIdx = Math.max(0, Math.floor(scrollContainer.scrollLeft / PIXELS_PER_HOUR) - 5);
            const endIdx = Math.min(state.hourlyData.length, Math.ceil((scrollContainer.scrollLeft + scrollContainer.clientWidth) / PIXELS_PER_HOUR) + 5);
            
            if (state.hourlyData.length < 2) return;

            // Helper to get color based on weather code
            const getPrecipTypeColor = (code) => {
                // Snow: 71, 73, 75, 77, 85, 86
                if ([71, 73, 75, 77, 85, 86].includes(code)) return '#e0f7fa'; // Cyan muy claro para nieve
                // Thunderstorm: 95, 96, 99
                if ([95, 96, 99].includes(code)) return '#3949ab'; // Indigo para tormentas
                // Default Rain
                return '#039be5'; // Azul lluvia
            };

            // Creamos el patrón de lluvia si no existe
            if (!cachedRainPattern) {
                const pCanvas = document.createElement('canvas');
                pCanvas.width = 10;
                pCanvas.height = 10;
                const pCtx = pCanvas.getContext('2d');
                pCtx.strokeStyle = '#0288d1';
                pCtx.lineWidth = 1;
                pCtx.globalAlpha = 0.5;
                pCtx.beginPath();
                pCtx.moveTo(2, 0);
                pCtx.lineTo(8, 10);
                pCtx.stroke();
                cachedRainPattern = ctx.createPattern(pCanvas, 'repeat');
            }
            if (!cachedSnowPattern) {
                const pCanvas = document.createElement('canvas');
                pCanvas.width = 10;
                pCanvas.height = 10;
                const pCtx = pCanvas.getContext('2d');
                pCtx.strokeStyle = '#b2ebf2';
                pCtx.lineWidth = 1;
                pCtx.globalAlpha = 0.5;
                pCtx.beginPath();
                pCtx.moveTo(2, 0);
                pCtx.lineTo(8, 10);
                pCtx.stroke();
                cachedSnowPattern = ctx.createPattern(pCanvas, 'repeat');
            }

            ctx.save();
            ctx.beginPath();
            
            // Dibujamos la silueta
            let first = true;
            for (let i = startIdx; i < endIdx; i++) {
                const d = state.hourlyData[i];
                const x = i * PIXELS_PER_HOUR + PIXELS_PER_HOUR / 2;
                const y = h - (h * (d.precipProb / 100));
                
                if (first) {
                    ctx.moveTo(x, y);
                    first = false;
                } else {
                    // Usamos una curva suave pero menos pomposa que las nubes
                    const prevD = state.hourlyData[i-1];
                    const prevX = (i-1) * PIXELS_PER_HOUR + PIXELS_PER_HOUR / 2;
                    const prevY = h - (h * (prevD.precipProb / 100));
                    const cpX1 = prevX + (x - prevX) / 3;
                    const cpX2 = prevX + 2 * (x - prevX) / 3;
                    ctx.bezierCurveTo(cpX1, prevY, cpX2, y, x, y);
                }
            }

            // Cerramos para el relleno
            const lastX = (endIdx - 1) * PIXELS_PER_HOUR + PIXELS_PER_HOUR / 2;
            const firstX = startIdx * PIXELS_PER_HOUR + PIXELS_PER_HOUR / 2;
            
            ctx.save();
            ctx.lineTo(lastX, h);
            ctx.lineTo(firstX, h);
            ctx.closePath();
            
            // Relleno con patrón (usamos el de lluvia por defecto para todo el área)
            ctx.fillStyle = cachedRainPattern;
            ctx.fill();
            ctx.restore();

            // Línea de contorno fina
            ctx.strokeStyle = '#0288d1';
            ctx.lineWidth = 1.5;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.stroke();
            
            // Añadimos puntos en cada hora si la probabilidad es > 0
            for (let i = startIdx; i < endIdx; i++) {
                const d = state.hourlyData[i];
                if (d.precipProb > 5) {
                    const x = i * PIXELS_PER_HOUR + PIXELS_PER_HOUR / 2;
                    const y = h - (h * (d.precipProb / 100));
                    ctx.beginPath();
                    ctx.arc(x, y, 2, 0, Math.PI * 2);
                    ctx.fillStyle = getPrecipTypeColor(d.weatherCode);
                    ctx.fill();
                    ctx.strokeStyle = 'white';
                    ctx.lineWidth = 0.5;
                    ctx.stroke();
                }
            }

            ctx.restore();
        }

        function drawTemperature(ctx, h, styles) {
            const color = '#d32f2f'; // Siempre modo claro
            const apparentColor = '#8b0000'; // Rojo oscuro para sensación térmica
            const textColor = '#1a1a1a'; // Siempre modo claro
            
            const startIdx = Math.max(0, Math.floor(scrollContainer.scrollLeft / PIXELS_PER_HOUR) - 5);
            const endIdx = Math.min(state.hourlyData.length, Math.ceil((scrollContainer.scrollLeft + scrollContainer.clientWidth) / PIXELS_PER_HOUR) + 5);

            // Sombreado entre temperatura y sensación térmica
            ctx.fillStyle = 'rgba(139, 0, 0, 0.2)';
            for (let i = startIdx; i < Math.min(endIdx, state.hourlyData.length - 1); i++) {
                const d = state.hourlyData[i];
                const nextD = state.hourlyData[i+1];
                const diff1 = Math.abs(d.temp - d.apparent);
                const diff2 = Math.abs(nextD.temp - nextD.apparent);
                
                if (diff1 >= 1 || diff2 >= 1) {
                    const x1 = i * PIXELS_PER_HOUR + PIXELS_PER_HOUR / 2;
                    const x2 = (i + 1) * PIXELS_PER_HOUR + PIXELS_PER_HOUR / 2;
                    
                    const y1_t = normalizeY(d.temp, -20, 40, h);
                    const y1_a = normalizeY(diff1 >= 1 ? d.apparent : d.temp, -20, 40, h);
                    
                    const y2_t = normalizeY(nextD.temp, -20, 40, h);
                    const y2_a = normalizeY(diff2 >= 1 ? nextD.apparent : nextD.temp, -20, 40, h);
                    
                    ctx.beginPath();
                    ctx.moveTo(x1, y1_t);
                    ctx.lineTo(x2, y2_t);
                    ctx.lineTo(x2, y2_a);
                    ctx.lineTo(x1, y1_a);
                    ctx.closePath();
                    ctx.fill();
                }
            }

            // Línea de sensación térmica
            ctx.strokeStyle = apparentColor;
            ctx.lineWidth = 1.5;
            ctx.setLineDash([4, 4]);
            ctx.beginPath();
            let hasStarted = false;
            for (let i = startIdx; i < endIdx; i++) {
                const d = state.hourlyData[i];
                const x = i * PIXELS_PER_HOUR + PIXELS_PER_HOUR / 2;
                const diff = Math.abs(d.temp - d.apparent);
                const targetY = diff >= 1 ? d.apparent : d.temp;
                const y = normalizeY(targetY, -20, 40, h);

                const prev = state.hourlyData[i-1];
                const next = state.hourlyData[i+1];
                const shouldDraw = diff >= 1 || 
                                 (prev && Math.abs(prev.temp - prev.apparent) >= 1) || 
                                 (next && Math.abs(next.temp - next.apparent) >= 1);

                if (shouldDraw) {
                    if (!hasStarted) {
                        ctx.moveTo(x, y);
                        hasStarted = true;
                    } else {
                        ctx.lineTo(x, y);
                    }
                } else {
                    if (hasStarted) {
                        ctx.stroke();
                        ctx.beginPath();
                        hasStarted = false;
                    }
                }
            }
            if (hasStarted) ctx.stroke();
            ctx.setLineDash([]);

            // Línea de temperatura normal
            ctx.strokeStyle = color;
            ctx.lineWidth = 3;
            ctx.beginPath();
            for (let i = startIdx; i < endIdx; i++) {
                const d = state.hourlyData[i];
                const x = i * PIXELS_PER_HOUR + PIXELS_PER_HOUR / 2;
                const y = normalizeY(d.temp, -20, 40, h);
                if (i === startIdx) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            }
            ctx.stroke();

            // Puntos y valores
            ctx.font = 'bold 10px Inter';
            ctx.textAlign = 'center';
            for (let i = startIdx; i < endIdx; i++) {
                const d = state.hourlyData[i];
                const x = i * PIXELS_PER_HOUR + PIXELS_PER_HOUR / 2;
                const y = normalizeY(d.temp, -20, 40, h);
                
                ctx.fillStyle = color;
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
                
                // Sombra para legibilidad (Halo blanco)
                ctx.save();
                ctx.shadowColor = 'white';
                ctx.shadowBlur = 3;
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'white';
                ctx.strokeText(d.temp.toFixed(1) + '°', x, y - 10);
                ctx.fillStyle = textColor;
                ctx.fillText(d.temp.toFixed(1) + '°', x, y - 10);
                ctx.restore();
            }
        }

        function drawAxes(ctx, w, h, styles) {
            ctx.save();
            ctx.fillStyle = '#666666'; // Siempre modo claro
            ctx.font = 'bold 10px Inter';
            ctx.textAlign = 'center';
            
            const startIdx = Math.max(0, Math.floor(scrollContainer.scrollLeft / PIXELS_PER_HOUR) - 5);
            const endIdx = Math.min(state.hourlyData.length, Math.ceil((scrollContainer.scrollLeft + scrollContainer.clientWidth) / PIXELS_PER_HOUR) + 5);

            for (let i = startIdx; i < endIdx; i++) {
                const d = state.hourlyData[i];
                const x = i * PIXELS_PER_HOUR + PIXELS_PER_HOUR / 2;
                const hours = d.localHour;
                
                // Sombra para legibilidad sobre lluvia (Halo blanco)
                ctx.save();
                ctx.shadowColor = 'white';
                ctx.shadowBlur = 3;
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'white';
                const label = hours.toString().padStart(2, '0');
                
                ctx.strokeText(label, x, h - 10);
                ctx.fillStyle = '#666666';
                ctx.fillText(label, x, h - 10);
                ctx.restore();
                
                // Ticks pequeños para todas las horas
                ctx.strokeStyle = '#666666';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, h);
                ctx.lineTo(x, h - 8);
                ctx.stroke();
            }

            // Iconos de Sol/Luna (Amanecer/Atardecer)
            ctx.font = '14px Inter';
            Object.keys(state.sunData).forEach(dateStr => {
                const sun = state.sunData[dateStr];
                const startTime = state.hourlyData[0].time;
                
                const sunriseX = ((sun.sunrise - startTime) / 3600000) * PIXELS_PER_HOUR + PIXELS_PER_HOUR/2;
                const sunsetX = ((sun.sunset - startTime) / 3600000) * PIXELS_PER_HOUR + PIXELS_PER_HOUR/2;

                if (sunriseX >= scrollContainer.scrollLeft && sunriseX <= scrollContainer.scrollLeft + scrollContainer.clientWidth) {
                    const sunriseTime = new Date(sun.sunrise).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', timeZone: state.timezone });
                    ctx.fillStyle = '#666666';
                    ctx.font = '9px Inter';
                    ctx.fillText(sunriseTime, sunriseX, h - 35);
                    ctx.font = '14px Inter';
                    ctx.fillText('☀️', sunriseX, h - 15);
                }
                if (sunsetX >= scrollContainer.scrollLeft && sunsetX <= scrollContainer.scrollLeft + scrollContainer.clientWidth) {
                    const sunsetTime = new Date(sun.sunset).toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', timeZone: state.timezone });
                    ctx.fillStyle = '#666666';
                    ctx.font = '9px Inter';
                    ctx.fillText(sunsetTime, sunsetX, h - 35);
                    ctx.font = '14px Inter';
                    ctx.fillText('🌙', sunsetX, h - 15);
                }
            });
            ctx.restore();
        }

        function drawCursor(ctx, h, styles) {
            const referenceX = scrollContainer.scrollLeft + 60;
            
            ctx.save();
            
            // Línea de referencia permanente
            ctx.strokeStyle = 'rgba(0,0,0,0.4)';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(referenceX, 0);
            ctx.lineTo(referenceX, h);
            ctx.stroke();

            // Línea de guía para "Ahora"
            if (state.hourlyData.length > 0) {
                const now = Date.now();
                const startTime = state.hourlyData[0].time;
                const nowX = ((now - startTime) / 3600000) * PIXELS_PER_HOUR + PIXELS_PER_HOUR / 2;
                
                const viewportStart = scrollContainer.scrollLeft;
                const viewportEnd = viewportStart + scrollContainer.clientWidth;
                
                if (nowX >= viewportStart && nowX <= viewportEnd && Math.abs(nowX - referenceX) > 5) {
                    ctx.strokeStyle = '#ff4d4d'; // Brighter red
                    ctx.setLineDash([5, 5]);
                    ctx.lineWidth = 2; // Thicker
                    ctx.beginPath();
                    ctx.moveTo(nowX, 0);
                    ctx.lineTo(nowX, h);
                    ctx.stroke();
                }
            }
            
            // Círculos indicadores en la línea de referencia fija (Intersección exacta corregida)
            const activeX = referenceX;
            
            // Cálculo de índice basado en midpoints (x = i * PPH + PPH/2)
            const floatIndex = (activeX - PIXELS_PER_HOUR / 2) / PIXELS_PER_HOUR;
            const index = Math.floor(floatIndex);
            const progress = floatIndex - index;
            
            if (index >= 0 && index < state.hourlyData.length - 1) {
                const d1 = state.hourlyData[index];
                const d2 = state.hourlyData[index + 1];
                
                const interpolate = (v1, v2) => v1 + (v2 - v1) * progress;
                
                const temp = interpolate(d1.temp, d2.temp);
                const apparent = interpolate(d1.apparent, d2.apparent);
                const clouds = interpolate(d1.clouds, d2.clouds);
                const precip = interpolate(d1.precip, d2.precip);
                const precipProb = interpolate(d1.precipProb, d2.precipProb);

                ctx.setLineDash([]);
                ctx.font = 'bold 10px Inter';
                ctx.textAlign = 'left';
                ctx.textBaseline = 'middle';
                ctx.strokeStyle = '#fff';
                ctx.lineWidth = 1.5;

                const drawPoint = (y, color, value, unit, shape = 'circle') => {
                    // El punto va en la Y exacta
                    ctx.fillStyle = color;
                    ctx.beginPath();
                    if (shape === 'circle') {
                        ctx.arc(activeX, y, 4, 0, Math.PI * 2);
                    } else if (shape === 'diamond') {
                        ctx.moveTo(activeX, y - 5);
                        ctx.lineTo(activeX + 5, y);
                        ctx.lineTo(activeX, y + 5);
                        ctx.lineTo(activeX - 5, y);
                        ctx.closePath();
                    }
                    ctx.fill();
                    ctx.stroke();
                    
                    if (value !== null) {
                        // El texto tiene margen de seguridad de 10px
                        const constrainedY = Math.max(10, Math.min(h - 10, y));
                        const text = ` ${value}${unit}`;
                        
                        ctx.save();
                        // Halo blanco para máxima legibilidad
                        ctx.shadowColor = 'white';
                        ctx.shadowBlur = 3;
                        ctx.lineWidth = 2;
                        ctx.strokeStyle = 'white';
                        ctx.strokeText(text, activeX + 6, constrainedY);
                        ctx.fillStyle = color;
                        ctx.fillText(text, activeX + 6, constrainedY);
                        ctx.restore();
                    }
                };

                // 1. Temperatura
                drawPoint(normalizeY(temp, -20, 40, h), '#d32f2f', null, '');

                // 2. Sensación Térmica
                drawPoint(normalizeY(apparent, -20, 40, h), '#8b0000', apparent.toFixed(1), '°C');

                // 3. Precipitación (Intersection logic: use the value of the bar the cursor is over)
                const closestData = progress < 0.5 ? d1 : d2;
                const pVal = closestData.precip;
                
                const maxH = h * 0.9;
                let barH = pVal * PIXELS_PER_MM;
                const isBroken = barH > maxH;
                const visualH = Math.min(maxH, barH);
                const barY = h - visualH;

                ctx.save();
                ctx.fillStyle = '#1976d2';
                ctx.font = 'bold 11px Inter';
                ctx.textAlign = 'center';
                ctx.shadowColor = 'white';
                ctx.shadowBlur = 3;
                ctx.lineWidth = 2;
                ctx.strokeStyle = 'white';
                const pText = pVal.toFixed(1) + ' mm' + (isBroken ? ' (!)' : '');
                ctx.strokeText(pText, activeX, barY - 5);
                ctx.fillText(pText, activeX, barY - 5);
                ctx.restore();

                // 4. Probabilidad de Precipitación (Intersección exacta con curva Bezier cúbica)
                const getProbY = (val) => h - (h * (val / 100));
                const py1 = getProbY(d1.precipProb);
                const py2 = getProbY(d2.precipProb);
                const t = progress;
                // Fórmula de Bezier cúbica con P1=P0 y P2=P3 (como en drawPrecipitationProbability)
                const probY = py1 * (1 - t) * (1 - t) * (1 + 2 * t) + py2 * t * t * (3 - 2 * t);
                drawPoint(probY, '#0288d1', Math.round(precipProb), '%', 'diamond');

                // 5. Nubes (Intersección exacta con curva cuadrática)
                const getY = (d) => h - (h * (d.clouds / 100));
                const y1 = getY(d1);
                const y2 = getY(d2);
                const midY = (y1 + y2) / 2;
                
                let cloudY;
                if (progress < 0.5) {
                    const t = progress * 2;
                    const cpY = Math.min(y1, midY) - 10;
                    cloudY = (1-t)*(1-t)*y1 + 2*(1-t)*t*cpY + t*t*midY;
                } else {
                    const t = (progress - 0.5) * 2;
                    const cpY = Math.min(midY, y2) - 10;
                    cloudY = (1-t)*(1-t)*midY + 2*(1-t)*t*cpY + t*t*y2;
                }
                drawPoint(cloudY, '#475569', Math.round(clouds), '%');
            }
            
            ctx.restore();
        }

        function drawMinimap() {
            const ctx = minimapCtx;
            const w = minimapCanvas.width / state.dpr;
            const h = minimapCanvas.height / state.dpr;
            const styles = getComputedStyle(document.documentElement);

            ctx.clearRect(0, 0, w, h);
            
            // Fondo soleado en minimapa (sin sol)
            const skyColor = '#fffde7'; // Siempre modo claro
            ctx.fillStyle = skyColor;
            ctx.fillRect(0, 0, w, h);

            const step = w / state.hourlyData.length;

            // Divisiones de días y etiquetas
            ctx.save();
            state.hourlyData.forEach((d, i) => {
                if (d.localHour === 0) {
                    const x = i * step;
                    ctx.strokeStyle = '#e0e0e0'; // Siempre modo claro
                    ctx.setLineDash([2, 2]);
                    ctx.lineWidth = 1;
                    ctx.beginPath();
                    ctx.moveTo(x, 0);
                    ctx.lineTo(x, h);
                    ctx.stroke();
                    
                    // Etiqueta del día (3 primeras letras)
                    ctx.setLineDash([]);
                    ctx.fillStyle = '#666666'; // Siempre modo claro
                    ctx.globalAlpha = 0.8;
                    ctx.font = 'bold 9px Inter';
                    ctx.textAlign = 'left';
                    const dayName = d.localDayShort;
                    ctx.shadowColor = 'white';
                    ctx.shadowBlur = 4;
                    ctx.fillText(dayName, x + 5, 12);
                    ctx.shadowBlur = 0;
                    ctx.globalAlpha = 1.0;
                }
            });
            ctx.restore();

            // Nubes en minimapa (suaves y nubosas con gradiente)
            const mCloudGrad = ctx.createLinearGradient(0, h, 0, 0);
            mCloudGrad.addColorStop(0, 'rgba(255, 255, 255, 0.5)');
            mCloudGrad.addColorStop(1, 'rgba(71, 85, 105, 0.8)');
            
            ctx.fillStyle = mCloudGrad;
            
            const mPoints = state.hourlyData.map((d, i) => ({
                x: i * step,
                y: h - (h * (d.clouds / 100))
            }));

            if (mPoints.length >= 2) {
                ctx.beginPath();
                ctx.moveTo(0, h);
                ctx.lineTo(mPoints[0].x, mPoints[0].y);
                
                for (let i = 0; i < mPoints.length - 1; i++) {
                    const p1 = mPoints[i];
                    const p2 = mPoints[i + 1];
                    const midX = (p1.x + p2.x) / 2;
                    const midY = (p1.y + p2.y) / 2;
                    
                    // Una pompa por tramo en el minimapa por espacio
                    const cpX = (p1.x + midX) / 2;
                    const cpY = Math.min(p1.y, midY) - 3;
                    ctx.quadraticCurveTo(cpX, cpY, midX, midY);
                    
                    const cpX2 = (midX + p2.x) / 2;
                    const cpY2 = Math.min(midY, p2.y) - 3;
                    ctx.quadraticCurveTo(cpX2, cpY2, p2.x, p2.y);
                }
                
                ctx.lineTo(w, h);
                ctx.closePath();
                ctx.fill();
            }

            // Precipitación en minimapa
            ctx.fillStyle = '#1976d288'; // Siempre modo claro
            const maxMinimapH = h * 0.9;
            state.hourlyData.forEach((d, i) => {
                if (d.precip > 0) {
                    let barH = d.precip * PIXELS_PER_MM;
                    if (barH > maxMinimapH) {
                        ctx.fillRect(i * step, h - maxMinimapH, step, maxMinimapH);
                        // Sutil zigzag en minimapa
                        ctx.save();
                        ctx.strokeStyle = 'white';
                        ctx.lineWidth = 0.5;
                        ctx.beginPath();
                        ctx.moveTo(i * step, h - maxMinimapH + 2);
                        ctx.lineTo(i * step + step, h - maxMinimapH + 4);
                        ctx.stroke();
                        ctx.restore();
                    } else {
                        ctx.fillRect(i * step, h - barH, step, barH);
                    }
                }
            });

            // Probabilidad de precipitación en minimapa
            if (state.hourlyData.length >= 2) {
                ctx.save();
                ctx.beginPath();
                state.hourlyData.forEach((d, i) => {
                    const x = i * step;
                    const y = h - (h * (d.precipProb / 100));
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                });
                ctx.strokeStyle = '#0288d1';
                ctx.lineWidth = 0.8;
                ctx.stroke();
                ctx.restore();
            }

            // Temperatura en minimapa
            ctx.strokeStyle = '#d32f2f'; // Siempre modo claro
            ctx.lineWidth = 1;
            ctx.beginPath();
            state.hourlyData.forEach((d, i) => {
                const x = i * step;
                const y = normalizeY(d.temp, -20, 40, h);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.stroke();

            // Línea de "Ahora" en minimapa
            if (state.hourlyData.length > 0) {
                const now = Date.now();
                const startTime = state.hourlyData[0].time;
                const endTime = state.hourlyData[state.hourlyData.length - 1].time;
                
                if (now >= startTime && now <= endTime) {
                    const nowX = ((now - startTime) / (endTime - startTime)) * w;
                    ctx.save();
                    ctx.strokeStyle = '#ff4d4d'; // Rojo más vivo
                    ctx.setLineDash([3, 3]);
                    ctx.lineWidth = 2; // Más gruesa
                    ctx.beginPath();
                    ctx.moveTo(nowX, 0);
                    ctx.lineTo(nowX, h);
                    ctx.stroke();
                    ctx.restore();
                }
            }

            const visibleRatio = scrollContainer.clientWidth / (state.hourlyData.length * PIXELS_PER_HOUR);
            const scrollRatio = scrollContainer.scrollLeft / (state.hourlyData.length * PIXELS_PER_HOUR);
            minimapViewport.style.width = (visibleRatio * 100) + '%';
            minimapViewport.style.left = (scrollRatio * 100) + '%';
            
            updateNowButtonPosition();
        }

        let lastNowBtnX = -1;
        let lastNowBtnMini = null;

        function updateNowButtonPosition() {
            if (state.hourlyData.length === 0) return;
            const nowBtn = document.getElementById('now-btn');
            const now = Date.now();
            const startTime = state.hourlyData[0].time;
            
            // Posición X real en el canvas
            const nowX = ((now - startTime) / 3600000) * PIXELS_PER_HOUR + PIXELS_PER_HOUR / 2;
            
            // Posición relativa al viewport del scroll
            const viewportX = nowX - scrollContainer.scrollLeft;
            const viewportWidth = scrollContainer.clientWidth;
            
            // Constreñimos la posición para que "pegue" a los bordes
            let displayX = viewportX;
            let isMini = false;
            
            const edgeMargin = 15; // Mitad del ancho mini (30/2)
            if (viewportX < edgeMargin) {
                displayX = edgeMargin;
                isMini = true;
            } else if (viewportX > viewportWidth - edgeMargin) {
                displayX = viewportWidth - edgeMargin;
                isMini = true;
            } else if (viewportX < 40 || viewportX > viewportWidth - 40) {
                isMini = true;
            }

            // Evitar actualizaciones innecesarias del DOM si no ha cambiado significativamente
            if (Math.abs(displayX - lastNowBtnX) < 0.01 && isMini === lastNowBtnMini) return;
            
            lastNowBtnX = displayX;
            lastNowBtnMini = isMini;

            nowBtn.style.transform = `translate3d(${displayX}px, 0, 0) translateX(-50%)`;
            if (isMini) {
                if (!nowBtn.classList.contains('mini')) nowBtn.classList.add('mini');
            } else {
                if (nowBtn.classList.contains('mini')) nowBtn.classList.remove('mini');
            }
        }

        /**
         * UTILIDADES
         */
        function normalizeY(val, min, max, height) {
            const norm = (val - min) / (max - min);
            return height - (norm * height * 0.8) - (height * 0.1); // Margen superior/inferior
        }

        function getAQIInfo(aqi) {
            if (aqi === null) return { text: '--', rec: '' };
            let level = 1;
            if (aqi <= 6) {
                level = aqi;
            } else {
                if (aqi <= 20) level = 1;
                else if (aqi <= 40) level = 2;
                else if (aqi <= 60) level = 3;
                else if (aqi <= 80) level = 4;
                else if (aqi <= 100) level = 5;
                else level = 6;
            }

            const map = {
                1: { t: 'Bueno', r: 'Calidad de aire ideal para actividades al aire libre.' },
                2: { t: 'Regular', r: 'Los grupos sensibles deben considerar reducir el esfuerzo físico.' },
                3: { t: 'Moderado', r: 'Se recomienda reducir actividades intensas al aire libre.' },
                4: { t: 'Pobre', r: 'Evite el esfuerzo físico prolongado al aire libre.' },
                5: { t: 'Muy Pobre', r: 'Mantenga las ventanas cerradas y evite salir.' },
                6: { t: 'Extremo', r: 'Alerta de salud: evite cualquier actividad al aire libre.' }
            };
            
            return { 
                text: map[level]?.t || 'Desconocido', 
                rec: map[level]?.r || '',
                val: aqi
            };
        }

        function getPollenText(val) {
            if (val === null || val === undefined) return '--';
            if (val < 1) return 'Nulo';
            if (val < 15) return 'Bajo';
            if (val < 50) return 'Medio';
            return 'Alto';
        }

        function drawPollenRadar(data) {
            const canvas = document.getElementById('pollen-radar');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = 45;
            const plants = [
                { name: 'Aliso', val: data.pollenDetails.alder, max: 50 },
                { name: 'Abedul', val: data.pollenDetails.birch, max: 50 },
                { name: 'Gramíneas', val: data.pollenDetails.grass, max: 30 },
                { name: 'Artemisa', val: data.pollenDetails.mugwort, max: 30 },
                { name: 'Olivo', val: data.pollenDetails.olive, max: 50 },
                { name: 'Ambrosía', val: data.pollenDetails.ragweed, max: 30 }
            ];

            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Dibujar fondo (hexágono)
            ctx.strokeStyle = 'rgba(128,128,128,0.4)';
            ctx.lineWidth = 1;
            for (let j = 1; j <= 3; j++) {
                ctx.beginPath();
                const r = (radius / 3) * j;
                for (let i = 0; i < 6; i++) {
                    const angle = (Math.PI / 3) * i - Math.PI / 2;
                    const x = centerX + r * Math.cos(angle);
                    const y = centerY + r * Math.sin(angle);
                    if (i === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.closePath();
                ctx.stroke();
            }

            // Ejes
            ctx.beginPath();
            for (let i = 0; i < 6; i++) {
                const angle = (Math.PI / 3) * i - Math.PI / 2;
                ctx.moveTo(centerX, centerY);
                ctx.lineTo(centerX + radius * Math.cos(angle), centerY + radius * Math.sin(angle));
            }
            ctx.stroke();

            // Etiquetas
            ctx.font = 'bold 9px Inter';
            ctx.fillStyle = 'var(--text-primary)';
            ctx.textAlign = 'center';
            plants.forEach((p, i) => {
                const angle = (Math.PI / 3) * i - Math.PI / 2;
                const x = centerX + (radius + 18) * Math.cos(angle);
                const y = centerY + (radius + 18) * Math.sin(angle);
                ctx.fillText(p.name.substring(0, 4), x, y + 3);
            });

            // Área de datos
            ctx.fillStyle = 'rgba(51, 153, 255, 0.6)';
            ctx.strokeStyle = '#3399ff';
            ctx.lineWidth = 2;
            ctx.beginPath();
            plants.forEach((p, i) => {
                const angle = (Math.PI / 3) * i - Math.PI / 2;
                const r = Math.min(radius, (p.val / p.max) * radius);
                const x = centerX + r * Math.cos(angle);
                const y = centerY + r * Math.sin(angle);
                if (i === 0) ctx.moveTo(x, y);
                else ctx.lineTo(x, y);
            });
            ctx.closePath();
            ctx.fill();
            ctx.stroke();

            // Detalles texto
            const details = document.getElementById('pollen-details');
            if (details) {
                details.innerHTML = plants.map(p => `<div style="display:flex; justify-content:space-between;"><span>${p.name}:</span> <b>${p.val.toFixed(1)}</b></div>`).join('');
            }
        }
        let lastTopPanelData = {};

        function updateTopPanel() {
            const referenceX = scrollContainer.scrollLeft + 60;
            const activeX = referenceX;
            
            // Cálculo de índice basado en midpoints (x = i * PPH + PPH/2)
            const floatIndex = (activeX - PIXELS_PER_HOUR / 2) / PIXELS_PER_HOUR;
            const index = Math.floor(floatIndex);
            const progress = floatIndex - index;
            
            let d;
            let interpolatedData = {};

            if (index >= 0 && index < state.hourlyData.length - 1) {
                const d1 = state.hourlyData[index];
                const d2 = state.hourlyData[index + 1];
                const interpolate = (v1, v2) => v1 + (v2 - v1) * progress;
                
                interpolatedData = {
                    temp: interpolate(d1.temp, d2.temp).toFixed(1),
                    apparent: interpolate(d1.apparent, d2.apparent).toFixed(1),
                    wind: interpolate(d1.wind, d2.wind).toFixed(1),
                    clouds: Math.round(interpolate(d1.clouds, d2.clouds)),
                    precip: interpolate(d1.precip, d2.precip).toFixed(1),
                    precipProb: Math.round(interpolate(d1.precipProb, d2.precipProb)),
                    aqi: d1.aqi,
                    pollen: d1.pollen,
                    weatherCode: d1.weatherCode
                };
                d = d1;
            } else {
                const safeIndex = Math.max(0, Math.min(state.hourlyData.length - 1, Math.round(floatIndex)));
                d = state.hourlyData[safeIndex];
                if (!d) return;
                interpolatedData = {
                    temp: d.temp.toFixed(1),
                    apparent: d.apparent.toFixed(1),
                    wind: d.wind.toFixed(1),
                    clouds: d.clouds,
                    precip: d.precip.toFixed(1),
                    precipProb: d.precipProb,
                    aqi: d.aqi,
                    pollen: d.pollen,
                    weatherCode: d.weatherCode
                };
            }

            // Solo actualizar si los datos han cambiado
            const currentData = {
                ...interpolatedData,
                scrollLeft: Math.round(scrollContainer.scrollLeft / 2) // Reducir frecuencia de actualización de tiempo
            };

            if (JSON.stringify(currentData) === JSON.stringify(lastTopPanelData)) return;
            lastTopPanelData = currentData;

            document.getElementById('val-temp').innerHTML = `${currentData.temp}<span class="data-unit">°C</span>`;
            document.getElementById('val-apparent').innerText = `ST: ${currentData.apparent}°C`;
            document.getElementById('val-wind').innerHTML = `${currentData.wind}<span class="data-unit">km/h</span>`;
            
            // AQI
            const aqiInfo = getAQIInfo(currentData.aqi);
            document.querySelector('#val-aqi .aqi-text').innerText = aqiInfo.text;
            document.getElementById('aqi-tooltip').innerHTML = `<b>Valor: ${aqiInfo.val}</b><br><div style="margin-top:5px; font-size:0.65rem; line-height:1.3;">${aqiInfo.rec}</div>`;
            
            // Polen
            const pollenText = getPollenText(currentData.pollen);
            document.querySelector('#val-pollen .pollen-text').innerText = pollenText;

            // Dibujamos el radar
            requestAnimationFrame(() => {
                drawPollenRadar(d);
            });

            document.getElementById('val-precip').innerHTML = `${currentData.precip}<span class="data-unit">mm</span>`;
            document.getElementById('val-precip-prob').innerHTML = `${currentData.precipProb}<span class="data-unit">%</span>`;
            document.getElementById('val-clouds').innerHTML = `${currentData.clouds}<span class="data-unit">%</span>`;
            
            // Calculamos el tiempo exacto basado en la posición X para mostrar minutos precisos
            const startTime = state.hourlyData[0].time;
            const exactTime = startTime + ((activeX - PIXELS_PER_HOUR / 2) / PIXELS_PER_HOUR) * 3600000;
            const date = new Date(exactTime);
            const today = new Date();
            const isToday = date.getDate() === today.getDate() && 
                            date.getMonth() === today.getMonth() && 
                            date.getFullYear() === today.getFullYear();
            
            const timeStr = date.toLocaleTimeString('es-ES', { hour: '2-digit', minute: '2-digit', timeZone: state.timezone });
            const dateStr = date.toLocaleString('es-ES', { 
                weekday: 'short', day: 'numeric', month: 'short', timeZone: state.timezone
            }).toUpperCase();

            const timeDisplay = document.getElementById('current-time-display');
            timeDisplay.querySelector('.time-main').innerText = timeStr;
            timeDisplay.querySelector('.date-sub').innerText = isToday ? `HOY, ${dateStr}` : dateStr;
            
            document.getElementById('weather-summary').innerText = getWeatherDescription(d.weatherCode);
            
            // Update location tooltip
            document.getElementById('tt-location').innerText = state.locationName;
            document.getElementById('tt-summary').innerText = getWeatherDescription(d.weatherCode);
        }

        function handleResize() {
            PIXELS_PER_HOUR = window.innerWidth < 600 ? 40 : 60;
            state.dpr = getDPR();

            const containerW = scrollContainer.clientWidth;
            const containerH = scrollContainer.clientHeight;
            const totalWidth = state.hourlyData.length * PIXELS_PER_HOUR;
            
            const canvasWrapper = document.getElementById('canvas-wrapper');
            if (canvasWrapper) canvasWrapper.style.width = totalWidth + 'px';

            mainCanvas.width = containerW * state.dpr;
            mainCanvas.height = containerH * state.dpr;
            mainCanvas.style.width = containerW + 'px';
            mainCanvas.style.height = containerH + 'px';
            
            offscreenCanvas.width = containerW * state.dpr;
            offscreenCanvas.height = containerH * state.dpr;
            
            // Sync position
            mainCanvas.style.transform = `translateX(${scrollContainer.scrollLeft}px)`;

            mainCtx.scale(state.dpr, state.dpr);
            offscreenCtx.scale(state.dpr, state.dpr);
            
            minimapCanvas.width = window.innerWidth * state.dpr;
            minimapCanvas.height = MINIMAP_HEIGHT * state.dpr;
            minimapCanvas.style.width = window.innerWidth + 'px';
            minimapCanvas.style.height = MINIMAP_HEIGHT + 'px';
            minimapCtx.scale(state.dpr, state.dpr);
            
            render();
        }

        function centerOnCurrentTime() {
            if (state.hourlyData.length === 0) return;
            const now = Date.now();
            const startTime = state.hourlyData[0].time;
            
            // Calculamos la posición X exacta para el momento actual
            // (ms transcurridos / ms por hora) * pixeles por hora + offset inicial del primer punto
            const exactX = ((now - startTime) / 3600000) * PIXELS_PER_HOUR + PIXELS_PER_HOUR / 2;
            
            // Centramos exactX en la línea de referencia fija (scrollLeft + 60)
            scrollContainer.scrollLeft = exactX - 60;
            state.hoverX = null; 
            render();
        }

        function handleMinimapClick(e) {
            const rect = minimapCanvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const ratio = Math.max(0, Math.min(1, x / rect.width));
            const totalWidth = state.hourlyData.length * PIXELS_PER_HOUR;
            scrollContainer.scrollLeft = (ratio * totalWidth) - (scrollContainer.clientWidth / 2);
        }

        function showError(msg) {
            const errDiv = document.getElementById('error-msg');
            errDiv.innerHTML = `
                <div style="margin-bottom: 15px;">${msg}</div>
                <button onclick="document.getElementById('overlay').classList.add('hidden')" 
                        style="background: #666; color: white; border: none; padding: 8px 16px; border-radius: 4px; cursor: pointer; font-size: 0.8rem;">
                    Cerrar y ver app
                </button>
            `;
            errDiv.style.display = 'block';
            const loader = document.querySelector('.loader');
            if (loader) loader.style.display = 'none';
            const statusText = document.getElementById('status-text');
            if (statusText) statusText.style.display = 'none';
        }
    </script>
</body>
</html>
