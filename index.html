<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="WeatherHist">
    <link rel="apple-touch-icon" href="./assets/images/icon-192.png">
    <link rel="icon" type="image/png" href="./assets/images/icon-192.png">
    <link rel="manifest" href="./manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Quicksand:wght@400;500;600&display=swap" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet" />
    <title>Weather Histogram</title>
    <link rel="stylesheet" href="./src/style.css">

</head>
<body>
    <div id="overlay">
        <div class="loader"></div>
        <p id="status-text">Obteniendo ubicación...</p>
        <div id="error-msg"></div>
    </div>

    <div id="controls-bar">
        <div class="mobile-toggles">
            <button id="toggle-search-btn" title="Cambiar ubicación"><span class="material-symbols-outlined">location_on</span></button>
        </div>

        <div class="controls-left">
            <div class="search-box" id="search-box">
                <input type="text" id="location-input" placeholder="Buscar ciudad (ej: Madrid, Tokyo)..." autocomplete="off">
                <div id="suggestions"></div>
                <button id="search-btn">Buscar</button>
                <button id="geo-btn" title="Usar mi ubicación"><span class="material-symbols-outlined">my_location</span></button>
            </div>
        </div>

        <div class="controls-right">
            <button class="theme-toggle" id="btn-info" title="Información y Ajustes" style="display: flex; align-items: center; justify-content: center; background:transparent; border:none; color:inherit; cursor:pointer;"><span class="material-symbols-outlined">info</span></button>
            <button class="theme-toggle" id="theme-toggle" style="display: flex; align-items: center; justify-content: center;"><span class="material-symbols-outlined">light_mode</span></button>
        </div>
    </div>

    <header id="top-panel">
        <div class="top-panel-info">
            <div class="location-group">
                <div id="location-name">Cargando...</div>
                <div id="weather-summary">--</div>
                <div class="custom-tooltip" id="location-tooltip">
                    <strong id="tt-location">Ubicación</strong><br>
                    <span id="tt-summary">Resumen del tiempo</span>
                </div>
            </div>
            <div id="current-time-display">
                <div class="time-main">--:--</div>
                <div class="date-sub">--</div>
            </div>
        </div>

        <div class="scroll-indicator scroll-indicator-left">
            <span class="material-symbols-outlined" style="font-size: 20px;">chevron_left</span>
        </div>
        <div class="top-panel-metrics">
            <div class="data-card" id="wind-card">
                <div id="wind-compass-container" style="display: flex; flex-direction: column; align-items: center; gap: 2px;">
                    <div style="font-size: 10px; font-weight: bold; line-height: 1; color: var(--text-secondary);">N</div>
                    <div id="wind-compass" style="width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid var(--text-secondary); position: relative; display: flex; align-items: center; justify-content: center;">
                        <div id="wind-arrow" style="width: 2px; height: 14px; background: var(--text-primary); position: relative; transition: transform 0.5s;">
                            <div style="position: absolute; top: -2px; left: -3px; width: 0; height: 0; border-left: 4px solid transparent; border-right: 4px solid transparent; border-bottom: 6px solid var(--text-primary);"></div>
                        </div>
                    </div>
                    <div class="data-value" id="val-wind" style="font-size: 0.9rem !important;">--<span class="data-unit">km/h</span></div>
                </div>
            </div>
            <div class="data-card">
                <div class="data-value" id="val-aqi" style="font-size: 1.1rem; display: flex; align-items: center; gap: 4px;">
                    <span class="material-symbols-outlined" style="font-size: 18px; color: var(--text-secondary);">eco</span>
                    <span class="aqi-text">--</span>
                    <span class="info-icon">i</span>
                    <div class="custom-tooltip" id="aqi-tooltip" style="min-width: 240px; padding: 12px;">
                        <div id="aqi-header-info" style="margin-bottom:8px;"></div>
                        <canvas id="aqi-radar" width="220" height="220" style="display:none; margin: 0 auto;"></canvas>
                        <div id="aqi-details" style="font-size: 0.75rem; line-height: 1.3; margin-top:5px;"></div>
                    </div>
                </div>
            </div>
            <div class="data-card">
                <div class="data-value" id="val-pollen" style="font-size: 1.1rem; display: flex; align-items: center; gap: 4px;">
                    <span class="material-symbols-outlined" style="font-size: 18px; color: var(--text-secondary);">local_florist</span>
                    <span class="pollen-text">--</span>
                    <span class="info-icon">i</span>
                    <div class="custom-tooltip" style="min-width: 240px; padding: 12px;">
                        <div style="text-align:center; font-weight:bold; margin-bottom:5px;">Riesgo por Planta</div>
                        <canvas id="pollen-radar" width="220" height="220" style="margin: 0 auto;"></canvas>
                        <div id="pollen-details" style="font-size: 0.75rem; line-height: 1.3;"></div>
                    </div>
                </div>
            </div>
            <div class="data-card">
                <div class="data-value" id="val-temp" style="font-size: 1.3rem;">--<span class="data-unit">°C</span></div>
                <div class="data-label" id="val-apparent" style="font-size: 0.6rem; margin-top: 1px;">ST: --°C</div>
            </div>
            <div class="data-card">
                <div class="data-value" id="val-precip" style="font-size: 1.3rem; display: flex; align-items: center; gap: 4px;">
                    <span class="material-symbols-outlined" style="font-size: 18px; color: var(--text-secondary);">rainy</span>
                    <span>--<span class="data-unit">mm</span></span>
                </div>
            </div>
            <div class="data-card">
                <div class="data-value" id="val-precip-prob" style="font-size: 1.3rem; display: flex; align-items: center; gap: 4px;">
                    <span class="material-symbols-outlined" style="font-size: 18px; color: var(--text-secondary);">water_drop</span>
                    <span>--<span class="data-unit">%</span></span>
                </div>
            </div>
            <div class="data-card">
                <div class="data-value" id="val-clouds" style="font-size: 1.3rem; display: flex; align-items: center; gap: 4px;">
                    <span class="material-symbols-outlined" style="font-size: 18px; color: var(--text-secondary);">cloud</span>
                    <span>--<span class="data-unit">%</span></span>
                </div>
            </div>
        </div>
        <div class="scroll-indicator scroll-indicator-right">
            <span class="material-symbols-outlined" style="font-size: 20px;">chevron_right</span>
        </div>
    </header>

    <div id="chart-area" style="position: relative; flex: 1; display: flex; flex-direction: column; overflow: hidden; background: #f5f5f5;">
        <div id="reference-line" style="position: absolute; left: 60px; top: 0; bottom: 0; width: 2px; background: rgba(0,0,0,0.4); z-index: 10; pointer-events: none;"></div>
        <canvas id="fixed-overlay-canvas" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 20;"></canvas>
        <button id="floating-now-btn" title="Ir al momento actual" style="position: absolute; top: 20px; right: 20px; z-index: 100; display: none; background: var(--card-bg); border: 1px solid var(--grid-color); color: var(--text-primary); width: 36px; height: 36px; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2); cursor: pointer; align-items: center; justify-content: center;">
            <span class="material-symbols-outlined" style="font-size: 20px;">my_location</span>
        </button>
        <main id="scroll-container">
            <div id="canvas-wrapper" style="position: relative;">
                <div id="past-shadow" style="position: absolute; top: 0; left: 0; bottom: 0; width: 0; pointer-events: none; z-index: 5;"></div>
                <div id="now-indicator" style="position: absolute; top: 0; bottom: 0; width: 2px; background: rgba(239, 68, 68, 0.5); pointer-events: none; z-index: 10; display: none; transform: translateX(-50%);">
                    <div style="position: absolute; top: 22px; left: -4px; transform: translateY(-50%); width: 10px; height: 10px; box-sizing: border-box; background: #ef4444; border-radius: 50%; border: 1.5px solid white; box-shadow: 0 0 12px rgba(239, 68, 68, 0.9); animation: pulse-breathing 2s infinite ease-in-out;"></div>
                </div>
                <canvas id="main-canvas" style="position: relative; z-index: 1;"></canvas>
            </div>
        </main>
    </div>

    <footer id="bottom-nav-container">
        <button id="toggle-nav-btn" class="toggle-nav-btn" title="Cambiar vista">
            <span class="material-symbols-outlined" style="font-size: 20px;">calendar_month</span>
        </button>

        <div id="minimap-container">
            <canvas id="minimap-canvas"></canvas>
            <div id="minimap-viewport"></div>
        </div>

        <div id="daily-cards-container">
            <!-- Cards will be generated here -->
        </div>
    </footer>

    <!-- Info & Settings Modal -->
    <div id="info-modal" style="display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(0,0,0,0.6); z-index: 2000; align-items: center; justify-content: center;">
        <div style="background: var(--card-bg); padding: 24px; border-radius: 12px; width: 90%; max-width: 320px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); position: relative; color: var(--text-primary); border: 1px solid var(--grid-color);">
            <button id="close-info-btn" style="position: absolute; top: 12px; right: 12px; background: transparent; border: none; font-size: 20px; color: inherit; cursor: pointer;"><span class="material-symbols-outlined">close</span></button>
            <h2 style="font-size: 1.2rem; margin-bottom: 20px; margin-top:0; font-weight: 600;">WeatherHist</h2>
            <p style="font-size: 0.9rem; margin-bottom: 8px;"><strong>Versión:</strong> <span id="app-version-label">v1.2.0</span></p>
            <p style="font-size: 0.9rem; margin-bottom: 20px;"><strong>Repositorio:</strong> <br><a href="https://github.com/MisterSabbo/WeatherHistogram" target="_blank" style="color: #3b82f6; text-decoration: none; word-break: break-all;">GitHub / MisterSabbo</a></p>
            
            <div style="margin-bottom: 20px;">
                <label for="chart-theme-select" style="font-size: 0.9rem; display: block; margin-bottom: 6px; font-weight: 500;">Tema de Gráficas:</label>
                <select id="chart-theme-select" style="width: 100%; padding: 8px; border-radius: 6px; border: 1px solid var(--grid-color); background: var(--input-bg); color: var(--text-primary); font-family: Inter;">
                    <option value="default">Clásico (Por defecto)</option>
                    <option value="neon">Neón Nocturno</option>
                    <option value="pastel">Pastel Suave</option>
                </select>
            </div>

            <button id="force-refresh-btn" style="width: 100%; padding: 10px; border-radius: 8px; border: none; background: #ef4444; color: white; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px;">
                <span class="material-symbols-outlined" style="font-size: 18px;">delete_history</span> Limpiar Caché y Recargar
            </button>
        </div>
    </div>

    <script src="./src/app.js" defer></script>

</body>
</html>
