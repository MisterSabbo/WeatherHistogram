<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>Sin conexión - Weather Histogram</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #2B2D31;
      color: #F2F3F5;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px;
    }
    .offline-card {
      text-align: center;
      max-width: 360px;
      padding: 40px 32px;
      background: #313338;
      border-radius: 16px;
      border: 1px solid #1E1F22;
      box-shadow: 0 8px 32px rgba(0,0,0,0.3);
    }
    .offline-icon {
      font-size: 48px;
      margin-bottom: 16px;
      display: block;
    }
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 8px; }
    p { font-size: 0.95rem; color: #B5BAC1; line-height: 1.5; margin-bottom: 24px; }
    button {
      background: #3b82f6;
      color: white;
      border: none;
      padding: 12px 32px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.2s;
    }
    button:hover { background: #2563eb; }
  </style>
</head>
<body>
  <div class="offline-card">
    <span class="offline-icon">📡</span>
    <h1>Sin conexión</h1>
    <p>No tienes conexión a internet. Los datos mostrados pueden no estar actualizados. Vuelve a intentarlo cuando tengas conexión.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
